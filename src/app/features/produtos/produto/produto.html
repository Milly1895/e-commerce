<mat-card class="produto">
<mat-card-header>
    <mat-card-title><h3>{{ nome | uppercase }}</h3></mat-card-title>
</mat-card-header>   

<mat-card-content>

    <p>{{ preco | precoFormatado }}</p>
</mat-card-content>

<mat-card-actions>
 
    <button mat-stroked-button color="wan"(click)="selecionarProduto()">
        Selecionar {{ nome }}
    </button> 

    <button mat-raised-button color="primary"(click)="adicionarAoCarrinho()">
        Adicionar ao Carrinho
    </button>

    </mat-card-actions>
    
</mat-card>
